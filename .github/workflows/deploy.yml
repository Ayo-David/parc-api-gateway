name: Deploy

# Runs after CI passes on main, so only validated configuration reaches the VPS.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

env:
  CONTAINER_NAME: parc-api-gateway
  KONG_IMAGE: kong:3.9.3

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production # requires manual approval if the "production" environment has protection rules configured
    concurrency:
      group: deploy-parc-api-gateway
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI validated, not whatever main points to now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Package configuration
        run: |
          {
            echo "REVISION=$(git rev-parse --short=7 HEAD)"
            echo "KONG_CONFIG_BASE64=$(base64 -w0 kong/kong.yml)"
            echo "APPLY_SCRIPT_BASE64=$(base64 -w0 deploy/apply-config.sh)"
          } >> "$GITHUB_ENV"

      - name: Apply configuration on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: CONTAINER_NAME,KONG_IMAGE,REVISION,KONG_CONFIG_BASE64,APPLY_SCRIPT_BASE64
          script: |
            set -euo pipefail
            printf '%s' "$APPLY_SCRIPT_BASE64" | base64 -d > /tmp/parc-api-gateway-apply.sh
            bash /tmp/parc-api-gateway-apply.sh
