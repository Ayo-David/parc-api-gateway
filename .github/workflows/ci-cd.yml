name: CI/CD

# Every pull request and push is validated; pushes to main (and manual runs) then deploy,
# so only validated configuration reaches the VPS.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main finish so a deploy is never cut short.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CONTAINER_NAME: parc-api-gateway
  KONG_IMAGE: kong:3.9.3

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Anonymous pulls from shared runner IPs are rate-limited; authenticated pulls are not, when credentials are configured.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn validate
      - name: Pull Kong image
        # Tries Docker Hub and two mirrors of the same official image, backing off between rounds.
        run: |
          for attempt in 1 2 3 4; do
            for image in "$KONG_IMAGE" "mirror.gcr.io/library/$KONG_IMAGE" "public.ecr.aws/docker/library/$KONG_IMAGE"; do
              if docker pull --quiet "$image"; then
                [ "$image" = "$KONG_IMAGE" ] || docker tag "$image" "$KONG_IMAGE"
                exit 0
              fi
            done
            echo "Pull attempt $attempt failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Validate with Kong
        run: docker run --rm -e KONG_DATABASE=off -v "$PWD/kong:/kong/declarative:ro" "$KONG_IMAGE" kong config parse /kong/declarative/kong.yml
      - run: docker compose -f compose.yaml config
      - run: yarn audit

  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production # requires manual approval if the "production" environment has protection rules configured
    concurrency:
      group: deploy-parc-api-gateway
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Package configuration
        run: |
          {
            echo "REVISION=$(git rev-parse --short=7 HEAD)"
            echo "KONG_CONFIG_BASE64=$(base64 -w0 kong/kong.yml)"
            echo "APPLY_SCRIPT_BASE64=$(base64 -w0 deploy/apply-config.sh)"
          } >> "$GITHUB_ENV"

      - name: Apply configuration on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: CONTAINER_NAME,KONG_IMAGE,REVISION,KONG_CONFIG_BASE64,APPLY_SCRIPT_BASE64
          script: |
            set -euo pipefail
            printf '%s' "$APPLY_SCRIPT_BASE64" | base64 -d > /tmp/parc-api-gateway-apply.sh
            bash /tmp/parc-api-gateway-apply.sh
