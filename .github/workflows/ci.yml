name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn validate
      - name: Validate with Kong
        run: docker run --rm -e KONG_DATABASE=off -v "$PWD/kong:/kong/declarative:ro" kong:3.9.3 kong config parse /kong/declarative/kong.yml
      - run: docker compose -f compose.yaml config
      - run: yarn audit
