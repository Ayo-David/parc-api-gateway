name: parc-api-gateway

services:
  kong:
    image: kong:3.9.3
    restart: unless-stopped
    read_only: true
    environment:
      KONG_DATABASE: "off"
      KONG_PREFIX: /tmp/kong
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_STATUS_LISTEN: 0.0.0.0:8100
    ports:
      - "${KONG_PROXY_HTTP_PORT:-8090}:8000"
      - "${KONG_PROXY_HTTPS_PORT:-9443}:8443"
      - "127.0.0.1:${KONG_ADMIN_PORT:-8091}:8001"
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=1777
    healthcheck:
      test: [CMD, kong, health]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - parc-edge

networks:
  parc-edge:
    name: parc-edge
    external: true
